<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>発注 — おでんと日本酒 卸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F2EE;
  --card:#FFFFFF;
  --ink:#191B1F;
  --sumi:#5D6067;
  --faint:#8C8F97;
  --rule:#D3D2CB;
  --hair:#E7E6E0;
  --blue:#1B4DB1;
  --blue-d:#143A87;
  --blue-t:#EDF2FC;
  --carbon:#E4E9ED;
  --carbon-ink:#3D4A54;
  --stamp:#BE3A2B;
  --ok:#2F6B4F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{
  background:#DCDAD2;color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
#app{
  max-width:430px;margin:0 auto;min-height:100vh;background:var(--paper);
  position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 20px 60px rgba(0,0,0,.12);
  padding-bottom:172px;overflow-x:hidden;
}
header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule);padding:13px 18px 10px}
.shopline{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.shop{font-weight:700;font-size:14px;letter-spacing:.02em}
.today{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--faint);letter-spacing:.04em;white-space:nowrap}
h1{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:26px;letter-spacing:.22em;margin:8px 0 0;line-height:1}
.h1sub{font-size:11.5px;color:var(--faint);margin-top:6px;letter-spacing:.04em}

.list{padding:13px 13px 0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:4px;margin-bottom:9px;overflow:hidden;transition:border-color .16s}
.card.on{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.cardhead{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:13px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:58px}
.kind{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:14px;letter-spacing:.03em;width:32px;height:32px;flex:0 0 32px;border:1px solid var(--rule);border-radius:2px;display:grid;place-items:center;color:var(--sumi);background:#FAFAF8}
.card.on .kind{border-color:var(--blue);color:var(--blue);background:var(--blue-t)}
.cname{flex:1;min-width:0}
.cname b{display:block;font-size:15.5px;font-weight:700}
.cmeta{font-size:11px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta .dv{color:var(--blue);font-weight:700}
.count{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12.5px;color:var(--blue);flex:0 0 auto}
.count.zero{color:#C7C6BE}
.chev{flex:0 0 auto;color:var(--faint);font-size:15px;transition:transform .18s}
.card.open .chev{transform:rotate(90deg)}
.items{display:none;border-top:1px solid var(--hair)}
.card.open .items{display:block}

/* 納品条件パネル */
.cond{background:var(--blue-t);border-bottom:1px solid #D5E0F3;padding:12px 13px}
.condrule{font-size:11px;color:var(--carbon-ink);line-height:1.6;margin-bottom:10px;padding-left:16px;position:relative}
.condrule:before{content:"紙";position:absolute;left:0;top:0;font-family:"Zen Old Mincho",serif;font-size:10px;color:var(--blue);border:1px solid var(--blue);border-radius:2px;padding:0 1px;line-height:1.2}
.condauto{background:#fff;border:1px solid var(--blue);border-radius:3px;padding:9px 11px;font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px;line-height:1.4}
.condauto small{display:block;font-weight:400;font-size:10.5px;color:var(--sumi);margin-top:3px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields .full{grid-column:1/-1}
.f label{display:block;font-size:10.5px;font-weight:700;color:var(--sumi);letter-spacing:.04em;margin-bottom:4px}
.f input,.f select{width:100%;min-height:44px;font:inherit;font-size:16px;padding:0 10px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
.f input[type=date]{font-family:"JetBrains Mono",monospace;font-size:15px}

.itembar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--hair);background:#FAFAF8}
.mini{font:inherit;font-size:12px;font-weight:700;padding:8px 12px;min-height:38px;background:#fff;border:1px solid var(--blue);color:var(--blue);border-radius:3px;cursor:pointer;letter-spacing:.02em}
.mini:active{background:var(--blue);color:#fff}
.mini.ghost{border-color:var(--rule);color:var(--faint)}
.row{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid var(--hair);min-height:56px;background:#fff}
.row:last-of-type{border-bottom:0}
.row.filled{background:#FBFCFF}
.code{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint);flex:0 0 38px;letter-spacing:-.02em}
.iname{flex:1;min-width:0;font-size:14.5px;line-height:1.25}
.iname small{display:block;font-size:10px;color:var(--faint);margin-top:2px;font-family:"JetBrains Mono",monospace}
.step{display:flex;align-items:center;flex:0 0 auto}
.step button{width:38px;height:38px;flex:0 0 38px;border:1px solid var(--rule);background:#fff;font-family:"JetBrains Mono",monospace;font-size:18px;color:var(--sumi);cursor:pointer;display:grid;place-items:center;padding:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.step button.hold{background:var(--blue);color:#fff;border-color:var(--blue)}
.step button:first-child{border-radius:3px 0 0 3px}
.step button:last-child{border-radius:0 3px 3px 0}
.step button:active{background:var(--blue);color:#fff;border-color:var(--blue)}
.step input{width:48px;height:38px;text-align:center;padding:0;border:1px solid var(--rule);border-left:0;border-right:0;font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700;background:#fff;color:var(--ink)}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input[type=number]{-moz-appearance:textfield}
.unit{flex:0 0 28px;font-size:11.5px;color:var(--sumi);font-family:"Zen Old Mincho",serif;font-weight:700}
.supnote{padding:11px 13px;font-size:11px;color:var(--sumi);background:#FFFCF0;border-top:1px solid var(--hair);line-height:1.55}
.supnote b{color:var(--stamp)}
.alert{padding:10px 13px;font-size:11.5px;background:#FDF0EE;border-top:1px solid #F0D5D0;color:var(--stamp);font-weight:700;line-height:1.5}

/* 編集モード */
.card.edit .itembar{background:#FFF6E8;border-bottom-color:#EBD9BC}
.mini.edit{border-color:#B07C1E;color:#B07C1E}
.mini.edit:active{background:#B07C1E;color:#fff}
.mini.on{background:#B07C1E;border-color:#B07C1E;color:#fff}
.erow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--hair);background:#fff;min-height:56px}
.erow .mv{display:flex;flex-direction:column;gap:2px;flex:0 0 26px}
.erow .mv button{width:26px;height:22px;padding:0;border:1px solid var(--rule);background:#fff;color:var(--sumi);font-size:10px;line-height:1;border-radius:2px;cursor:pointer}
.erow .mv button:active{background:var(--sumi);color:#fff}
.erow .ec{flex:0 0 46px}
.erow .en{flex:1;min-width:0}
.erow .eu{flex:0 0 52px}
.erow input{width:100%;min-height:40px;font:inherit;font-size:16px;padding:0 7px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
.erow input.small{font-size:13px;font-family:"JetBrains Mono",monospace}
.erow .del{flex:0 0 38px;width:38px;height:38px;border:1px solid #E0BFB9;background:#FDF0EE;color:var(--stamp);border-radius:3px;font-size:16px;cursor:pointer;padding:0}
.erow .del:active{background:var(--stamp);color:#fff}
.addbox{padding:12px;background:#FFF6E8;border-bottom:1px solid var(--hair)}
.addbox .ttl{font-size:11px;font-weight:700;color:#8A6416;letter-spacing:.06em;margin-bottom:8px}
.addgrid{display:flex;gap:7px;align-items:flex-end}
.addgrid .g1{flex:0 0 52px}.addgrid .g2{flex:1;min-width:0}.addgrid .g3{flex:0 0 56px}
.addgrid label{display:block;font-size:9.5px;color:var(--sumi);font-weight:700;margin-bottom:3px}
.addgrid input{width:100%;min-height:42px;font:inherit;font-size:16px;padding:0 7px;border:1px solid var(--rule);border-radius:3px}
.addgrid button{min-height:42px;padding:0 13px;flex:0 0 auto;font:inherit;font-size:13px;font-weight:700;background:#B07C1E;color:#fff;border:0;border-radius:3px;cursor:pointer}
.addsup{margin:0 13px 13px;padding:13px;background:#fff;border:1px dashed var(--rule);border-radius:4px}
.addsup .ttl{font-size:12px;font-weight:700;margin-bottom:9px;color:var(--sumi)}
.addsup .r{display:flex;gap:7px;margin-bottom:7px}
.addsup input{flex:1;min-width:0;min-height:44px;font:inherit;font-size:16px;padding:0 9px;border:1px solid var(--rule);border-radius:3px}
.addsup button{width:100%;min-height:46px;font:inherit;font-size:14px;font-weight:700;background:#fff;border:1px solid var(--blue);color:var(--blue);border-radius:3px;cursor:pointer}
.addsup button:active{background:var(--blue);color:#fff}

/* 発注リスト */
.basket{margin:4px 13px 0;background:#fff;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.bhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--hair)}
.bhead b{font-size:13px;letter-spacing:.04em}
.bhead span{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--faint)}
.bgrp{padding:10px 14px;border-bottom:1px solid var(--hair)}
.bgrp:last-child{border-bottom:0}
.bgrp .g{font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:5px}
.bgrp .l{font-size:12.5px;color:var(--sumi);line-height:1.7}
.bgrp .l em{font-style:normal;font-weight:700;color:var(--ink);font-family:"JetBrains Mono",monospace}

.sendbar{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:430px;margin:0 auto;background:var(--paper);border-top:1px solid var(--rule);padding:10px 13px calc(10px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:2px;margin-bottom:9px}
.tab{flex:1;font:inherit;font-size:11.5px;font-weight:700;padding:9px 0;min-height:40px;cursor:pointer;background:transparent;border:1px solid var(--rule);border-radius:3px;color:var(--faint);letter-spacing:.06em}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.send{width:100%;min-height:56px;font:inherit;font-size:16.5px;font-weight:700;letter-spacing:.06em;background:var(--blue);color:#fff;border:0;border-radius:4px;cursor:pointer}
.send:disabled{background:#CFCEC7;color:#F3F2EE;cursor:default}
.send:active:not(:disabled){background:var(--blue-d)}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(25,27,31,.55);display:none;overflow-y:auto}
.scrim.show{display:block}
.sheetwrap{max-width:430px;margin:0 auto;min-height:100vh;background:var(--carbon);padding-bottom:130px}
.sheettop{position:sticky;top:0;z-index:5;background:var(--carbon);border-bottom:1px solid #C4CFD6;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheettop b{font-size:13.5px;letter-spacing:.04em;color:var(--carbon-ink)}
.xbtn{font:inherit;font-size:13px;font-weight:700;background:none;border:0;color:var(--carbon-ink);cursor:pointer;padding:10px;min-height:44px}
.steps{display:flex;align-items:center;gap:6px;padding:11px 15px;background:#DDE4E9;font-size:11px;color:var(--carbon-ink);border-bottom:1px solid #C4CFD6}
.steps i{font-style:normal;width:17px;height:17px;border-radius:50%;background:#fff;border:1px solid var(--carbon-ink);display:grid;place-items:center;font-size:9.5px;font-family:"JetBrains Mono",monospace}
.steps .cur{font-weight:700}
.steps .cur i{background:var(--blue);border-color:var(--blue);color:#fff}
.steps .sep{flex:1;height:1px;background:#B4C0C8}
.paper{background:#fff;margin:13px 11px;padding:15px 13px 17px;border:1px solid #B9C4CB;box-shadow:0 2px 0 rgba(61,74,84,.09);position:relative}
.ptitle{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:18px;letter-spacing:.4em;text-align:center;padding-bottom:5px;border-bottom:2.5px solid var(--ink);margin:0 auto 12px;width:fit-content;padding-left:.4em}
.pto{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12px;margin-bottom:10px;line-height:1.65}
.pto .vendor{font-weight:700;font-size:13.5px}
.pto .faxno{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--sumi)}
.pto .right{text-align:right;flex:0 0 auto}
table.sheet{width:100%;border-collapse:collapse;font-size:12px}
table.sheet th{background:var(--ink);color:#fff;font-weight:500;font-size:10px;letter-spacing:.05em;padding:5px 3px;border:1px solid var(--ink)}
table.sheet td{border:1px solid #9C9890;padding:6px 5px;line-height:1.35}
table.sheet td.c{font-family:"JetBrains Mono",monospace;font-size:10px;text-align:center;color:var(--sumi)}
table.sheet td.q{text-align:right;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13.5px;padding-right:6px}
.freelist{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.freerow{display:flex;align-items:baseline;gap:8px;padding:9px 2px;border-bottom:1px dotted var(--rule)}
.freerow:last-child{border-bottom:0}
.freerow .n{flex:1;font-size:14.5px;font-weight:500}
.freerow .x{font-family:"JetBrains Mono",monospace;color:var(--faint);font-size:12px}
.freerow .v{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700;min-width:28px;text-align:right}
.freerow .u2{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:11.5px;width:24px}
.pmemo{margin-top:10px;border:1px solid #9C9890;padding:7px 8px;font-size:11.5px;line-height:1.5}
.pmemo b{font-size:9.5px;letter-spacing:.08em;color:var(--sumi);display:block;margin-bottom:3px}
.pfoot{margin-top:10px;font-size:10px;color:var(--sumi);line-height:1.6}
.pfoot .warn{color:var(--stamp);font-weight:700}
.seal{position:absolute;top:8px;right:10px;width:58px;height:58px;border:2.5px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-items:center;text-align:center;font-family:"Zen Old Mincho",serif;font-weight:900;font-size:11.5px;line-height:1.15;transform:rotate(-11deg) scale(.4);opacity:0;transition:transform .32s cubic-bezier(.2,1.5,.4,1),opacity .18s}
.seal.on{transform:rotate(-11deg) scale(1);opacity:.92}
.mockbar{margin:0 11px 13px;padding:9px 11px;background:#fff;border:1px dashed var(--carbon-ink);font-size:10.5px;color:var(--carbon-ink);line-height:1.55}

.pane{display:none;padding:13px}
.pane.show{display:block}
.hrec{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:12px 14px;margin-bottom:9px}
.hrec .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.hrec .dt{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700}
.hrec .st{font-size:10px;font-weight:700;color:var(--ok);letter-spacing:.04em}
.hrec .bd{font-size:12.5px;color:var(--sumi);line-height:1.65}
.hrec .bd em{font-style:normal;font-weight:700;color:var(--ink)}
.hrec .dl{font-size:10.5px;color:var(--blue);font-weight:700;margin-top:6px}
.trow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--hair)}
.trow .tn{flex:1;font-size:13.5px;min-width:0}
.bararea{flex:0 0 80px;height:7px;background:var(--hair);border-radius:1px;overflow:hidden}
.bararea i{display:block;height:100%;background:var(--blue)}
.tv{font-family:"JetBrains Mono",monospace;font-size:13.5px;font-weight:700;flex:0 0 50px;text-align:right}
.tv span{font-size:9.5px;font-weight:400;color:var(--faint);font-family:"Zen Old Mincho",serif}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--faint);border-bottom:1px solid var(--rule);padding-bottom:6px;margin:0 0 10px}
.demo{background:#FFFCF0;border:1px solid #E0D6B4;border-radius:3px;padding:10px 12px;font-size:11.5px;color:#7A6A3E;line-height:1.55;margin-bottom:13px}
.empty{text-align:center;padding:44px 20px;color:var(--faint);font-size:13px;line-height:1.8}
.backup{margin-top:18px;padding:13px;background:#fff;border:1px dashed var(--rule);border-radius:4px}
.backup .ttl{font-size:12px;font-weight:700;margin-bottom:5px}
.backup p{font-size:11px;color:var(--sumi);line-height:1.6;margin:0 0 10px}
.backup .r{display:flex;gap:8px}
.backup button,.backup label{flex:1;min-height:44px;font:inherit;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--rule);color:var(--sumi);border-radius:3px;cursor:pointer;display:grid;place-items:center}
.backup button:active,.backup label:active{background:var(--sumi);color:#fff}
.backup input[type=file]{display:none}
.where{font-size:10.5px;color:var(--faint);margin-top:9px;font-family:"JetBrains Mono",monospace}
.toast{position:fixed;bottom:126px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:3px;font-size:13px;font-weight:700;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="shopline"><span class="shop">おでんと日本酒　卸</span><span class="today" id="today"></span></div>
    <h1 id="ptitle">発注</h1>
    <div class="h1sub" id="psub">仕入先6軒 · 数量を入れた分だけ送ります</div>
  </header>
  <div class="pane show" id="pane-order">
    <div class="list" id="list"></div>
    <div id="basket"></div>
  </div>
  <div class="pane" id="pane-hist"></div>
  <div class="pane" id="pane-sum"></div>
  <div class="sendbar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-p="order">発注</button>
      <button class="tab" role="tab" aria-selected="false" data-p="hist">履歴</button>
      <button class="tab" role="tab" aria-selected="false" data-p="sum">月の数量</button>
    </div>
    <button class="send" id="send" disabled>数量を入れてください</button>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="sheetwrap">
    <div class="sheettop"><b id="sheetlbl">内容を確認</b><button class="xbtn" id="close">戻る</button></div>
    <div class="steps">
      <span><i>1</i></span><span>数量を入力</span><span class="sep"></span>
      <span class="cur"><i>2</i></span><span class="cur">内容を確認</span><span class="sep"></span>
      <span><i>3</i></span><span>送信</span>
    </div>
    <div class="mockbar">試作品です。実際のFAXは送信されません。本番はこの紙面をPDFにしてFAX送信APIへ渡します。</div>
    <div id="sheets"></div>
    <div style="padding:0 11px 20px"><button class="send" id="confirm">この内容でFAX送信</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SHOP={name:"おでんと日本酒　卸",zip:"810-0041",addr:"福岡県福岡市中央区大名1丁目11-23 リアンナ大名2F",tel:"092-753-9633"};

/* ===== 仕入先マスタ（写真6枚から書き起こし） =====
   delivery: "pick" = 希望日を店が指定 / "monthu" = 月・木のみ / "gomi" = 先方の表で自動計算 */
const DEFAULT_SUPPLIERS=[
{ id:"coppelia",badge:"青",name:"コッペリア",kind:"青果",fax:"092-581-3987",tel:"092-581-3965",
  form:"table",title:"発 注 表",delivery:"pick",

const key=(s,i)=>s.id+":"+i;
const q=(s,i)=>qty[key(s,i)]||0;
const filled=s=>s.items.filter((_,i)=>q(s,i)>0).length;
const active=()=>SUPPLIERS.filter(s=>filled(s)>0);
const M=s=>meta[s.id]||(meta[s.id]={date:"",slot:"",memo:""});

const WD=["日","月","火","水","木","金","土"];
const fmt=d=>`${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const nextWD=(d,w)=>{let x=addD(d,1);while(x.getDay()!==w)x=addD(x,1);return x};

/* 先方の納品ルールから納品日を出す */
function calcDelivery(s,now){
  if(s.delivery==="monthu"){           // 月(1)・木(4)のみ
    const a=nextWD(now,1),b=nextWD(now,4);
    return a<b?a:b;
  }
  if(s.delivery==="gomi"){
    const d=now.getDay(),h=now.getHours()+now.getMinutes()/60;
    if(d===0||d===6) return nextWD(now,2);          // 土日 → 火
    if(d===5) return (h>=8.5&&h<12)?addD(now,1):nextWD(now,2); // 金
    return (h>=8.5&&h<12)?addD(now,1):addD(now,2);  // 月〜木
  }
  return null;
}

/* ===== 保存先 =====
   この会話の中で開いたときは window.storage、
   Netlify などに置いて開いたときは端末のブラウザ保存を使う。
   どちらも使えない場合はメモリだけ（閉じると消える）。 */
const DB=(()=>{
  const mem={};
  const hasWS=typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function";
  let hasLS=false;
  try{const k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);hasLS=true}catch(e){}
  return {
    where: hasWS?"会話内":(hasLS?"この端末":"保存なし"),
    async get(k){
      if(hasWS){try{const r=await window.storage.get(k);return r&&r.value?r.value:null}catch(e){}}
      if(hasLS){try{return localStorage.getItem(k)}catch(e){}}
      return mem[k]||null;
    },
    async set(k,v){
      if(hasWS){try{await window.storage.set(k,v);return true}catch(e){}}
      if(hasLS){try{localStorage.setItem(k,v);return true}catch(e){}}
      mem[k]=v;return false;
    }
  };
})();

function paper(s,stamped){
  const now=new Date(),m=M(s);
  const rows=s.items.map((it,i)=>({it,v:q(s,i)})).filter(r=>r.v>0);
  const auto=calcDelivery(s,now);
  const dd=auto?fmt(auto):(m.date?fmt(new Date(m.date+"T00:00")):"未指定");
  let body="";
  if(s.form==="table"){
    body=`<table class="sheet"><thead><tr><th style="width:50px">コード</th><th>商品名</th><th style="width:70px">注文数</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="c">${r.it.code}</td><td>${r.it.name}</td><td class="q">${r.v}<span style="font-size:9.5px;font-weight:400;padding-left:3px">${r.it.unit}</span></td></tr>`).join("")}</tbody></table>`;
  }else if(s.form==="seiko"){
    body=`<table class="sheet"><thead><tr><th style="width:46px">発注コード</th><th>商品名</th><th style="width:48px">規格</th><th style="width:32px">ロット</th><th style="width:48px">発注数</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="c">${r.it.code}</td><td>${r.it.name}</td><td class="c">${r.it.spec||""}</td><td class="c">${r.it.lot||""}</td><td class="q">${r.v}<span style="font-size:9.5px;font-weight:400;padding-left:2px">${r.it.unit}</span></td></tr>`).join("")}</tbody></table>`;
  }else if(s.form==="gomi"){
    const tp=rows.reduce((n,r)=>n+r.v,0);
    body=`<table class="sheet"><thead><tr><th style="width:30px"></th><th>区分・容量・色</th><th style="width:70px">パック数</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="c">${r.it.code}</td><td>${r.it.name}<br><span style="font-size:9.5px;color:#8C8F97">${r.it.spec}</span></td><td class="q">${r.v}<span style="font-size:9.5px;font-weight:400;padding-left:3px">パック</span></td></tr>`).join("")}
      <tr><td colspan="2" style="text-align:right;font-weight:700">総パック数</td><td class="q">${tp}</td></tr></tbody></table>
      ${tp<2?`<div class="pfoot"><span class="warn">総パック数が2パック未満です。先方は2パック以上からの受付です。</span></div>`:""}`;
  }else{
    body=`<div class="freelist">${rows.map(r=>`<div class="freerow"><span class="n">${r.it.name}</span><span class="x">×</span><span class="v">${r.v}</span><span class="u2">${r.it.unit}</span></div>`).join("")}</div>`;
  }
  const memo=m.memo?`<div class="pmemo"><b>備考</b>${m.memo}</div>`:"";
  let foot=`<div class="pfoot">${SHOP.name}　TEL ${SHOP.tel}<br>${SHOP.zip} ${SHOP.addr}</div>`;
  if(s.id==="seiko")foot=`<div class="pfoot"><span class="warn">※1回の発注は2本以上でお願いします</span><br>※納品は月・木曜日（土日祝を除く）<br><br>${SHOP.name}　TEL ${SHOP.tel}</div>`;
  if(s.id==="kankyo")foot=`<div class="pfoot">顧客コード ${s.custNo}<br>${SHOP.zip} ${SHOP.addr}<br>事業所名 ${SHOP.name}　TEL ${SHOP.tel}</div>`;

  return `<div class="paper"><div class="seal ${stamped?"on":""}">送信<br>済</div>
    <div class="ptitle">${s.title}</div>
    <div class="pto"><span><span class="vendor">${s.name}　御中</span><br><span class="faxno">FAX ${s.fax}</span></span>
      <span class="right"><b style="font-size:12.5px">${SHOP.name}　様</b><br>
        <span class="faxno">発注 ${fmt(now)}</span><br>
        <span class="faxno">${dd} 納品分${m.slot?"（"+m.slot+"）":""}</span>
        ${s.custNo&&s.id==="seiko"?`<br><span class="faxno">No. ${s.custNo}</span>`:""}</span></div>
    ${body}${memo}${foot}</div>`;
}

  $("#scrim").classList.add("show");document.body.style.overflow="hidden";
}
function closeSheets(){$("#scrim").classList.remove("show");document.body.style.overflow=""}

function doSend(){
  const a=active(),d=new Date();
  document.querySelectorAll("#sheets .seal").forEach((el,i)=>setTimeout(()=>el.classList.add("on"),i*130));
  a.forEach(s=>{const au=calcDelivery(s,d),m=M(s);
    history.unshift({sup:s.id,name:s.name,date:fmt(d),ts:d.getTime(),
      deliv:au?fmt(au):(m.date?fmt(new Date(m.date+"T00:00")):"未指定"),slot:m.slot||"",memo:m.memo||"",
      lines:s.items.map((it,i)=>({name:it.name,unit:it.unit,v:q(s,i)})).filter(l=>l.v>0)})});
  save();
  $("#confirm").disabled=true;$("#confirm").textContent="送信しました（モック）";
  setTimeout(()=>{closeSheets();qty={};meta={};
    $("#confirm").disabled=false;$("#confirm").textContent="この内容でFAX送信";
    renderList();renderHist();renderSum();toast(`${a.length}軒に送信しました`)},1250);
}

  p.innerHTML=`<p class="eyebrow">送信した発注の控え</p>`+history.slice(0,60).map(h=>
    `<div class="hrec"><div class="hd"><span class="dt">${h.date}　${h.name}</span><span class="st">送信済</span></div>
     <div class="bd">${h.lines.map(l=>`${l.name} <em>${l.v}</em>${l.unit}`).join("　/　")}</div>
     <div class="dl">${h.deliv} 納品${h.slot?"（"+h.slot+"）":""}</div>
     ${h.memo?`<div class="bd" style="margin-top:4px;font-size:11.5px">備考: ${h.memo}</div>`:""}</div>`).join("")
    +backupBox();
  bindBackup();
}
function bindBackup(){
  const ex=$("#exp"),im=$("#imp");if(!ex)return;
  ex.onclick=()=>{
    const blob=new Blob([JSON.stringify({v:1,masters:SUPPLIERS,history},null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`発注データ_${iso(new Date())}.json`;
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast("書き出しました");
  };
  im.onchange=()=>{
    const f=im.files&&im.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.masters))throw 0;
        SUPPLIERS=d.masters;history=Array.isArray(d.history)?d.history:[];
        await saveMasters();await save();
        renderList();renderHist();renderSum();toast("読み込みました");
      }catch(e){toast("このファイルは読めませんでした")}
      im.value="";
    };
    r.readAsText(f);
  };
}

const DEMO=[{name:"玉葱",unit:"玉",v:214},{name:"白滝",unit:"P",v:96},{name:"牛スジ",unit:"kg",v:62},
{name:"大根",unit:"本",v:58},{name:"八海山",unit:"本",v:34},{name:"玉子L",unit:"P",v:28},
{name:"ぎょうざ巻",unit:"ケ",v:24},{name:"青ねぎカットM（0.5キロ）",unit:"P",v:22},
{name:"ジャガイモ（馬鈴薯）",unit:"kg",v:18},{name:"景虎",unit:"本",v:16},{name:"椎茸",unit:"P",v:14}];
function renderSum(){
  const p=$("#pane-sum"),now=new Date(),m0=new Date(now.getFullYear(),now.getMonth(),1).getTime(),agg={};
  history.filter(h=>h.ts>=m0).forEach(h=>h.lines.forEach(l=>{const k=l.name+"|"+l.unit;agg[k]=(agg[k]||0)+l.v}));
  let rows=Object.entries(agg).map(([k,v])=>({name:k.split("|")[0],unit:k.split("|")[1],v})).sort((a,b)=>b.v-a.v);
  const isDemo=!rows.length;if(isDemo)rows=DEMO;
  const max=rows[0].v;
  p.innerHTML=(isDemo?`<div class="demo">サンプルです。1か月使うと送った発注がそのまま積み上がります。<br>金額は入りません。発注書に単価が載らないためです。単価を出すには請求書を読み取る仕組みが別に必要です。</div>`:"")
    +`<p class="eyebrow">${now.getMonth()+1}月の発注数量　品目別</p>`
    +rows.map(r=>`<div class="trow"><span class="tn">${r.name}</span>
      <span class="bararea"><i style="width:${Math.round(r.v/max*100)}%"></i></span>
      <span class="tv">${r.v}<span>${r.unit}</span></span></div>`).join("")
    +`<div class="pfoot" style="margin-top:14px;color:#8C8F97">これは発注数で、納品数ではありません。欠品や代替品、電話での追加分があると請求書とずれます。</div>`;
}

/* ===== ＋ − の長押しで連続加減算 =====
   連打すると iOS がダブルタップ拡大と誤認するので、押しっぱなしで増える形にする。
   保持中は全体を描き直さず、その行の数字だけ書き換える。 */
let hold=null, byPointer=false;
function bump(s,i,d){
  qty[key(s,i)]=Math.max(0,q(s,i)+d);
  const inp=document.querySelector(`input[data-act=set][data-s="${s.id}"][data-i="${i}"]`);
  if(inp){const v=q(s,i);inp.value=v||"";inp.closest(".row").classList.toggle("filled",v>0)}
}
function stopHold(){
  if(!hold)return;
  clearTimeout(hold.t);clearInterval(hold.iv);
  hold.btn.classList.remove("hold");
  hold=null;
  renderList();   // 納品日・件数・発注リストをまとめて更新
}
$("#list").addEventListener("pointerdown",e=>{
  const b=e.target.closest("button[data-act=inc],button[data-act=dec]");
  if(!b)return;
  const s=SUPPLIERS.find(x=>x.id===b.dataset.s),i=+b.dataset.i;
  const d=b.dataset.act==="inc"?1:-1;
  byPointer=true;
  b.classList.add("hold");
  bump(s,i,d);
  let speed=180;
  hold={btn:b,t:setTimeout(()=>{                       // 0.4秒押し続けたら連続
    hold.iv=setInterval(()=>{
      bump(s,i,d);
      if(speed>55){speed-=12;clearInterval(hold.iv);    // だんだん速く
        hold.iv=setInterval(()=>bump(s,i,d),speed)}
    },speed);
  },400),iv:null};
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>
  $("#list").addEventListener(ev,stopHold));

$("#list").addEventListener("click",e=>{
  const head=e.target.closest(".cardhead");
  if(head){const id=head.closest(".card").dataset.s;open=(open===id)?null:id;renderList();return}
  const b=e.target.closest("button[data-act]");if(!b)return;
  const act=b.dataset.act;

  if(act==="addsup"){
    const nm=$("#ns-name").value.trim(),fx=$("#ns-fax").value.trim();
    if(!nm){toast("仕入先の名前を入れてください");return}
    const id="s"+Date.now();
    SUPPLIERS.push({id,badge:nm.slice(0,1),name:nm,kind:"",fax:fx||"未設定",
      form:"free",title:"発 注 書",delivery:"pick",
      rule:"納品日の決まりは登録していません。必要なら希望日を指定してください。",items:[]});
    saveMasters();open=id;editing=id;renderList();
    toast(nm+" を追加しました。商品を登録してください");
    setTimeout(()=>document.querySelector(`[data-s="${id}"]`)?.scrollIntoView({block:"center"}),60);
    return;
  }

  const s=SUPPLIERS.find(x=>x.id===b.dataset.s),i=+b.dataset.i;
  if(!s)return;

  if(act==="edit"){editing=(editing===s.id)?null:s.id;if(editing)open=s.id;renderList();return}
  if(act==="del"){
    const nm=s.items[i].name;
    s.items.splice(i,1);delete qty[key(s,i)];
    saveMasters();renderList();toast(nm+" を削除しました");return;
  }
  if(act==="up"||act==="down"){
    const j=act==="up"?i-1:i+1;
    if(j<0||j>=s.items.length)return;
    [s.items[i],s.items[j]]=[s.items[j],s.items[i]];
    const a1=qty[key(s,i)],a2=qty[key(s,j)];
    if(a2===undefined)delete qty[key(s,i)];else qty[key(s,i)]=a2;
    if(a1===undefined)delete qty[key(s,j)];else qty[key(s,j)]=a1;
    saveMasters();renderList();return;
  }
  if(act==="add"){
    const nm=$("#an-"+s.id).value.trim();
    if(!nm){toast("商品名を入れてください");return}
    s.items.push({code:$("#ac-"+s.id).value.trim(),name:nm,unit:$("#au-"+s.id).value.trim()||"個",prev:0});
    saveMasters();renderList();toast(nm+" を追加しました");
    setTimeout(()=>$("#an-"+s.id)?.focus(),60);return;
  }

  if(act==="inc"||act==="dec"){
    if(byPointer){byPointer=false;return}   // 指の操作は pointerdown 側で処理済み
    qty[key(s,i)]=Math.max(0,q(s,i)+(act==="inc"?1:-1));
  }
  if(act==="prev"){const last=history.find(h=>h.sup===s.id);
    s.items.forEach((it,j)=>{qty[key(s,j)]=last?((last.lines.find(l=>l.name===it.name)||{}).v||0):(it.prev||0)});
    toast(last?"前回の送信内容を入れました":"よく頼む数量を入れました")}
  if(act==="clr")s.items.forEach((_,j)=>delete qty[key(s,j)]);
  renderList();
});
$("#list").addEventListener("change",e=>{
  const ed=e.target.closest("[data-ed]");
  if(ed){const s=SUPPLIERS.find(x=>x.id===ed.dataset.s);
    if(s){const it=s.items[+ed.dataset.i];
      if(it){const v=ed.value.trim();
        if(ed.dataset.ed==="name"&&!v){toast("商品名は空にできません");renderList();return}
        it[ed.dataset.ed]=v;saveMasters()}}
    return}
  const inp=e.target.closest("[data-act=set]");
  if(inp){const s=SUPPLIERS.find(x=>x.id===inp.dataset.s);
    qty[key(s,+inp.dataset.i)]=Math.max(0,parseInt(inp.value||"0",10)||0);renderList();return}
  const f=e.target.closest("[data-fld]");
  if(f){const s=SUPPLIERS.find(x=>x.id===f.dataset.s);M(s)[f.dataset.fld]=f.value;renderList()}
});
$("#send").addEventListener("click",openSheets);
$("#close").addEventListener("click",closeSheets);
$("#confirm").addEventListener("click",doSend);
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  pane=t.dataset.p;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  ["order","hist","sum"].forEach(k=>$("#pane-"+k).classList.toggle("show",k===pane));
  const T={order:["発注","仕入先6軒 · 数量を入れた分だけ送ります"],hist:["履歴","紙のFAXでは残らない控え"],sum:["数量","今月なにをどれだけ仕入れたか"]};
  $("#ptitle").textContent=T[pane][0];$("#psub").textContent=T[pane][1];
  $("#send").style.display=pane==="order"?"":"none";window.scrollTo(0,0);
}));
(async()=>{$("#today").textContent=fmt(new Date());await load();renderList();renderHist();renderSum()})();
